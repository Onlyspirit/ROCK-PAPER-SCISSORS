<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RockPaperScissors</title>
    <link rel="stylesheet" href="STYLES/10-ROCK-PAPER-SCISSORS.css">
</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button" onclick="playGame('rock')"><img class="move-icon" src="images/rock-emoji.png"
            alt="Rock"></button>
    <button class="move-button" onclick="playGame('paper')"><img src="images/paper-emoji.png" class="move-icon"
            alt="Paper"></button>
    <button class="move-button" onclick="playGame('scissors')"><img src="images/scissors-emoji.png" class="move-icon"
            alt="scissors"></button>
    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score score "></p>
    <button class="reset-score-button" onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement();
    ">Reset Score</button>
    <script src="SCRIPTS/10-ROCK-PAPER-SCISSORS.js"></script>
</body>
</html>
